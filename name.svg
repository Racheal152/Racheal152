<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 160"
  width="900"
  height="160"
>

  <defs>
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff69b4"/>
      <stop offset="50%" stop-color="#ffb6d9"/>
      <stop offset="100%" stop-color="#ff69b4"/>
    </linearGradient>
  </defs>

  <!-- Falling flowers -->

  <g font-family="Arial, sans-serif" font-size="22">

    <text x="40" y="-10">
      🌸
      <animate
        attributeName="y"
        from="-20"
        to="180"
        dur="7s"
        repeatCount="indefinite"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 40 20;25 40 20;-20 40 20;0 40 20"
        dur="3s"
        repeatCount="indefinite"/>
    </text>

    <text x="140" y="-30">
      🌸
      <animate
        attributeName="y"
        from="-30"
        to="180"
        dur="9s"
        begin="1s"
        repeatCount="indefinite"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 140 20;-25 140 20;20 140 20;0 140 20"
        dur="4s"
        repeatCount="indefinite"/>
    </text>

    <text x="250" y="-20">
      🌸
      <animate
        attributeName="y"
        from="-20"
        to="180"
        dur="8s"
        begin="3s"
        repeatCount="indefinite"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 250 20;20 250 20;-20 250 20;0 250 20"
        dur="3.5s"
        repeatCount="indefinite"/>
    </text>

    <text x="360" y="-35">
      🌸
      <animate
        attributeName="y"
        from="-35"
        to="180"
        dur="10s"
        begin="2s"
        repeatCount="indefinite"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 360 20;-20 360 20;20 360 20;0 360 20"
        dur="4s"
        repeatCount="indefinite"/>
    </text>

    <text x="470" y="-15">
      🌸
      <animate
        attributeName="y"
        from="-15"
        to="180"
        dur="7.5s"
        begin="4s"
        repeatCount="indefinite"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 470 20;25 470 20;-25 470 20;0 470 20"
        dur="3s"
        repeatCount="indefinite"/>
    </text>

    <text x="580" y="-30">
      🌸
      <animate
        attributeName="y"
        from="-30"
        to="180"
        dur="9s"
        begin="1.5s"
        repeatCount="indefinite"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 580 20;-20 580 20;20 580 20;0 580 20"
        dur="3.5s"
        repeatCount="indefinite"/>
    </text>

    <text x="690" y="-20">
      🌸
      <animate
        attributeName="y"
        from="-20"
        to="180"
        dur="8s"
        begin="5s"
        repeatCount="indefinite"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 690 20;20 690 20;-20 690 20;0 690 20"
        dur="4s"
        repeatCount="indefinite"/>
    </text>

    <text x="820" y="-35">
      🌸
      <animate
        attributeName="y"
        from="-35"
        to="180"
        dur="10s"
        begin="2.5s"
        repeatCount="indefinite"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="0 820 20;-25 820 20;25 820 20;0 820 20"
        dur="3s"
        repeatCount="indefinite"/>
    </text>

  </g>


  <!-- Main title -->

  <text
    x="450"
    y="95"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="800"
    letter-spacing="-2"
    fill="url(#pinkGradient)"
  >
    Software Engineer
  </text>

</svg>
